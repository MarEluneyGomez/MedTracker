spring.application.name=medtracker

# La conexion se toma de variables de entorno (ver database/.env.local en el README).
# En Neon, el connection string ya viene en formato JDBC-compatible si le cambias
# el prefijo jdbc:postgresql:// y le sacas el usuario/password de la URL.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medtracker}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate en vez de update/create: el schema se aplica a mano con
# database/schema.sql (ver README), Hibernate solo chequea que las
# entidades coincidan con las tablas ya creadas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# El SQL por consola solo se activa a pedido (JPA_SHOW_SQL=true) para depurar
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Jackson 3 lee los nombres de parámetros de los constructores y arma los
# objetos con el @AllArgsConstructor de Lombok, dejando en null lo que no
# viene en el JSON: rompe los boolean primitivos y pisa los valores por
# defecto. Desactivándolo usa el constructor vacío + setters, como Jackson 2.
spring.jackson.mapper.detect-parameter-names=false

# Los errores los arma GlobalExceptionHandler con mensajes pensados para el
# cliente. Lo que llegue al /error de Spring (fuera del advice) no debe exponer
# nada interno; se fija explícito para pisar los valores que activa devtools.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
# Devtools lo activa y loguea cabeceras (Authorization) y parámetros en DEBUG
spring.mvc.log-request-details=false
# Ni Spring ("Resolved [...]", que devtools activa) ni Hibernate (el "Detail:
# Key (...)" de PostgreSQL) deben volcar al log los valores de la fila: las
# violaciones de integridad las registra GlobalExceptionHandler sin ellos.
spring.mvc.log-resolved-exception=false
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=off

# Zona horaria de los usuarios: define qué es "hoy" para el job diario de
# dosis y el cron de medianoche. Se puede pisar con la variable MEDTRACKER_TIMEZONE.
medtracker.timezone=${MEDTRACKER_TIMEZONE:America/Argentina/Buenos_Aires}

# Herramientas de desarrollo/testing (POST /doses/generate-daily). Apagadas por
# defecto: la ruta responde 404 como si no existiera. Se activan solo en un
# entorno de pruebas con MEDTRACKER_DEV_TOOLS_ENABLED=true. El job automatico de
# medianoche y el de arranque no dependen de esta propiedad.
medtracker.dev-tools.enabled=${MEDTRACKER_DEV_TOOLS_ENABLED:false}

# JWT (obligatorio): JWT_SECRET no tiene valor por defecto y la app no arranca
# si falta o tiene menos de 32 caracteres (HS256). La expiración se puede
# pisar con JWT_EXPIRATION_MINUTES (por defecto 24 horas).
medtracker.jwt.secret=${JWT_SECRET:}
medtracker.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Refresh token (sesión renovable): opaco, se guarda solo su hash. Cada
# POST /auth/refresh lo rota y le da otra ventana, así que la sesión se cierra
# tras este tiempo sin uso. Se puede pisar con JWT_REFRESH_EXPIRATION_MINUTES
# (por defecto 48 horas).
medtracker.jwt.refresh-expiration-minutes=${JWT_REFRESH_EXPIRATION_MINUTES:2880}

# Omisión automática de tomas (RN-04): cada "interval" (duración ISO-8601, por
# defecto 5 minutos) las tomas PENDING cuyo horario pasó hace más de
# skip-after-minutes (por defecto 120) se marcan SKIPPED. Con
# auto-skip.enabled=false el job no se registra (por ejemplo, para pruebas
# contra una base compartida). El primer ciclo también omite las PENDING históricas.
medtracker.dose.skip-after-minutes=${MEDTRACKER_DOSE_SKIP_AFTER_MINUTES:120}
medtracker.dose.auto-skip.interval=${MEDTRACKER_DOSE_AUTO_SKIP_INTERVAL:PT5M}
medtracker.dose.auto-skip.enabled=${MEDTRACKER_DOSE_AUTO_SKIP_ENABLED:true}

# Push de recordatorio (RF-06, CU-05). provider: "log" es el cliente simulado
# (no envía nada); el real se agrega en D-2.
medtracker.push.provider=${MEDTRACKER_PUSH_PROVIDER:log}
# Interruptor del job de push: apagado por defecto (true para encenderlo). Para
# hot-tests y corridas locales contra Neon dejarlo en false o limitarlo con
# allowed-user-ids.
medtracker.push.enabled=${MEDTRACKER_PUSH_ENABLED:false}
# Cada cuánto corre el job (duración ISO-8601, por defecto 1 minuto).
medtracker.push.interval=${MEDTRACKER_PUSH_INTERVAL:PT1M}
# Minutos después de la hora de la toma en que se manda el push (0 = a la hora;
# 15 = respaldo). Debe ser menor que skip-after-minutes, o el auto-skip omitiría
# la toma antes del push.
medtracker.push.delay-minutes=${MEDTRACKER_PUSH_DELAY_MINUTES:15}
# Ventana de recuperación: no se mandan pushes de tomas más viejas que
# delay + catch-up (por ejemplo, tras una caída o al encender el job).
medtracker.push.catch-up-minutes=${MEDTRACKER_PUSH_CATCH_UP_MINUTES:30}
# Ids de usuario (UUID separados por coma) a los que se limita el push, para
# pruebas contra una base compartida. Vacío = todos.
medtracker.push.allowed-user-ids=${MEDTRACKER_PUSH_ALLOWED_USER_IDS:}
# Cliente FCM (provider=fcm). Credenciales de la cuenta de servicio SOLO por entorno,
# nunca en el repo: credentials-json es el CONTENIDO del JSON (tiene prioridad) y
# credentials-file es la RUTA del archivo (GOOGLE_APPLICATION_CREDENTIALS). Con fcm
# y ninguna de las dos la app no arranca.
medtracker.push.fcm.credentials-json=${MEDTRACKER_PUSH_FCM_CREDENTIALS_JSON:}
medtracker.push.fcm.credentials-file=${GOOGLE_APPLICATION_CREDENTIALS:}
# Tiempos límite de red en milisegundos (mayores que 0 y como máximo 60000).
medtracker.push.fcm.connect-timeout-ms=${MEDTRACKER_PUSH_FCM_CONNECT_TIMEOUT_MS:5000}
medtracker.push.fcm.read-timeout-ms=${MEDTRACKER_PUSH_FCM_READ_TIMEOUT_MS:10000}

# Hilos de los jobs programados. Por defecto Spring usa uno solo compartido: un envio
# push lento retrasaria la omision automatica de tomas.
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:2}
# Al apagar la app se espera a que termine el envio en curso (hasta el plazo) en
# vez de cortarlo a la mitad.
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=${SPRING_TASK_SCHEDULING_SHUTDOWN_PERIOD:30s}
