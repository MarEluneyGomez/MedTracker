spring.application.name=medtracker

# La conexion se toma de variables de entorno (ver database/.env.local en el README).
# En Neon, el connection string ya viene en formato JDBC-compatible si le cambias
# el prefijo jdbc:postgresql:// y le sacas el usuario/password de la URL.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medtracker}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate en vez de update/create: el schema se aplica a mano con
# database/schema.sql (ver README), Hibernate solo chequea que las
# entidades coincidan con las tablas ya creadas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
