spring.application.name=medtracker

# La conexion se toma de variables de entorno (ver database/.env.local en el README).
# En Neon, el connection string ya viene en formato JDBC-compatible si le cambias
# el prefijo jdbc:postgresql:// y le sacas el usuario/password de la URL.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medtracker}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate en vez de update/create: el schema se aplica a mano con
# database/schema.sql (ver README), Hibernate solo chequea que las
# entidades coincidan con las tablas ya creadas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# El SQL por consola solo se activa a pedido (JPA_SHOW_SQL=true) para depurar
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Jackson 3 lee los nombres de parámetros de los constructores y arma los
# objetos con el @AllArgsConstructor de Lombok, dejando en null lo que no
# viene en el JSON: rompe los boolean primitivos y pisa los valores por
# defecto. Desactivándolo usa el constructor vacío + setters, como Jackson 2.
spring.jackson.mapper.detect-parameter-names=false

# Los errores los arma GlobalExceptionHandler con mensajes pensados para el
# cliente. Lo que llegue al /error de Spring (fuera del advice) no debe exponer
# nada interno; se fija explícito para pisar los valores que activa devtools.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
# Devtools lo activa y loguea cabeceras (Authorization) y parámetros en DEBUG
spring.mvc.log-request-details=false
# Ni Spring ("Resolved [...]", que devtools activa) ni Hibernate (el "Detail:
# Key (...)" de PostgreSQL) deben volcar al log los valores de la fila: las
# violaciones de integridad las registra GlobalExceptionHandler sin ellos.
spring.mvc.log-resolved-exception=false
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=off

# Zona horaria de los usuarios: define qué es "hoy" para el job diario de
# dosis y el cron de medianoche. Se puede pisar con la variable MEDTRACKER_TIMEZONE.
medtracker.timezone=${MEDTRACKER_TIMEZONE:America/Argentina/Buenos_Aires}

# JWT (obligatorio): JWT_SECRET no tiene valor por defecto y la app no arranca
# si falta o tiene menos de 32 caracteres (HS256). La expiración se puede
# pisar con JWT_EXPIRATION_MINUTES (por defecto 24 horas).
medtracker.jwt.secret=${JWT_SECRET:}
medtracker.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
